[package]
name = "easytier-manager"
version = "0.4.5"
description = "EasyTier Manager"
authors = ["EasyTier Manager Contributors"]
edition = "2021"
rust-version = "1.77"

# Mobile targets link the app into a native library the platform loads itself;
# the desktop binary keeps reaching the same code through `rlib`.
[lib]
name = "easytier_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [ "tray-icon"] }
# Self-update for the manager bundle. `updater_builder` returns the builder
# directly rather than a `Result` from 2.11 on, so the minor is pinned.
# Desktop only — the updater plugin supports Windows, Linux and macOS, and
# `app_update` is compiled out everywhere else (see `lib.rs`).
tauri-plugin-updater = "2.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# `reqwest` pulls rustls without a provider, so the app installs one itself at
# startup (see `lib.rs`). `ring` matches the provider reqwest already enables.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
zip = "2"
regex = "1"
walkdir = "2"
tempfile = "3"
# `fs`/`io-util` are for streaming the Android APK download to disk.
tokio = { version = "1", features = ["rt", "time", "sync", "fs", "io-util"] }

# macOS: the privileged helper (launchd + unix socket) and the launchd service
# manager. `home` is pinned because newer 0.5.x releases require Rust 1.88 while
# this app's declared MSRV is 1.77.
[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
libc = "0.2"
service-manager = "0.11"
home = "=0.5.9"

# Windows: register and control the EasyTier core service through the Service
# Control Manager, mirror EasyTier's service work-directory registry key, and tie
# the supervised core's lifetime to the service host with a job object.
[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
winreg = "0.56"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
] }

# Android: the core cannot be installed as a service, and a non-root app only
# gets a TUN device from `VpnService` — whose file descriptor has to be attached
# to an instance living in *this* process. So the core is linked in instead of
# downloaded (see `mobile_core.rs`), and the plugin that owns the `VpnService`
# comes with it. `easytier` on crates.io is a stale 2.0.x snapshot without the
# mobile TUN API, so these are pinned to the release tag the app is built
# against; moving the tag is part of a core update.
[target.'cfg(target_os = "android")'.dependencies]
easytier = { git = "https://github.com/EasyTier/EasyTier", tag = "v2.7.0" }
easytier-core = { git = "https://github.com/EasyTier/EasyTier", tag = "v2.7.0" }
tauri-plugin-vpnservice = { git = "https://github.com/EasyTier/EasyTier", tag = "v2.7.0" }
anyhow = "1"
uuid = { version = "1", features = ["serde", "v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "registry", "env-filter"] }
