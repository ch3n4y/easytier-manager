name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: macOS Universal
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Universal package
        run: pnpm tauri build --target universal-apple-darwin

      - name: Verify ad-hoc signature
        run: codesign --verify --deep --strict --verbose=2 "src-tauri/target/universal-apple-darwin/release/bundle/macos/EasyTier Desktop.app"

      - name: Prepare installer
        run: mv "src-tauri/target/universal-apple-darwin/release/bundle/dmg/"*.dmg EasyTier-Desktop_0.0.1_macos_universal.dmg

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          EasyTier-Desktop_0.0.1_macos_universal.dmg
          --repo "$GITHUB_REPOSITORY"
          --title "EasyTier Desktop $GITHUB_REF_NAME"
          --notes "macOS Universal 安装包，同时支持 Apple 芯片与 Intel 芯片。使用 ad-hoc 签名，首次打开时 macOS 仍可能要求用户确认。"
