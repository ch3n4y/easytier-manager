name: Build & Release

on:
  push:
    # Tags publish. `main` is here to keep the dependency cache warm: a workflow
    # run can only restore caches from its own branch and the default branch, and
    # caches never cross tag names — so without a default-branch build, every
    # release would recompile the whole tree from scratch.
    branches: [main]
    tags: ["v*"]
  # For warming the cache without pushing a commit.
  workflow_dispatch:

jobs:
  macos:
    name: macOS Universal
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      # Compiling the dependency tree is most of this job. Saved only on `main`,
      # since a cache written under one tag can never be read by another.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `createUpdaterArtifacts` makes the build sign the update archive, so the
      # private key has to be here or the bundle step fails outright. The password
      # is empty, but the variable still has to be set: without it the signer
      # stops on an interactive prompt, which in CI just hangs.
      - name: Build Universal package
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: pnpm tauri build --target universal-apple-darwin

      - name: Verify ad-hoc signature
        run: codesign --verify --deep --strict --verbose=2 "src-tauri/target/universal-apple-darwin/release/bundle/macos/EasyTier Manager.app"

      # Only a tag has anything to publish; a `main` run is here for the cache.
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: macos
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig

  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      # See the macOS job: the cache is written on `main` and read here.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build NSIS installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: pnpm tauri build

      # In the default `createUpdaterArtifacts` mode the NSIS installer is its own
      # update bundle: the updater downloads the `.exe` and checks it against the
      # `.exe.sig` beside it. The `.nsis.zip` form only appears under
      # `"v1Compatible"`.
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: windows
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe.sig


  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The core is cross-compiled per ABI; only arm64 is bundled today, but the
      # gradle plugin asks cargo for the others unless the targets exist.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The action's default package list still asks for `tools`, which no
      # longer exists in the SDK repository and makes it fail outright. The
      # runner image already ships the SDK; only platform-tools needs checking.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # easytier-proto generates its types with protoc; the runner has no
      # protobuf toolchain by default.
      - name: Install protoc and NDK
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          sdkmanager --install "ndk;27.2.12479018"

      # The keystore never lives in the repo. Without it Gradle emits an
      # unsigned APK, which Android refuses to install as an update.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set; the APK would be unsigned"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          cat > src-tauri/gen/android/keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build APK
        # Read ANDROID_HOME from the shell: the action exports it through
        # GITHUB_ENV, which is not guaranteed to be visible to `env:` here.
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          pnpm tauri android build --apk --target aarch64

      - name: Verify the APK is signed
        run: |
          set -euo pipefail
          apk=$(ls src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk | head -n1)
          case "$apk" in *unsigned*) echo "::error::APK is unsigned: $apk"; exit 1;; esac
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$apk"

      # The app picks its update out of the release by this suffix, so the name
      # is part of the contract rather than cosmetic.
      - name: Name the asset
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          src=$(ls src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk | head -n1)
          mkdir -p dist
          cp "$src" "dist/EasyTier-Manager-${version}-android.apk"
          ls -l dist

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: android
          path: dist/*-android.apk

  publish:
    name: Publish release
    needs: [macos, windows, android]
    # A push to `main` runs the same builds to warm the cache, but only a tag
    # publishes.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Shared by the release and by `latest.json`, so the notes the updater
      # shows are the same ones on the release page.
      RELEASE_NOTES: |
        macOS 通用安装包（Apple 芯片 + Intel，ad-hoc 签名）与 Windows x64 安装包（NSIS）。Windows 版本以管理员权限运行。

        - 修复：服务日志权限不正确时，点「刷新」会报无权限。安装、更新与启动现在都会把日志目录和文件纠正为可读，失败时给出明确的中文提示而不是裸的系统错误。
        - 日志面板会自动滚动到最新一行；向上翻看历史时不会被强行拉回，点「刷新」则直接跳到最新。
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      # download-artifact keeps the directory structure each artifact was
      # uploaded from, so the files arrive nested under `dmg/`, `macos/` and
      # `nsis/`. Flatten them into one directory under URL-safe names, because
      # `latest.json` refers to assets by name and the spaces in Tauri's file
      # names do not survive the trip through a download URL intact.
      - name: Collect release assets
        run: |
          mkdir -p dist
          find installers -type f -print0 | while IFS= read -r -d '' file; do
            cp "$file" "dist/$(basename "$file" | tr ' ' '-')"
          done
          ls -l dist

      # The manifest the in-app updater reads: for each platform, the archive to
      # download and the signature to check it against. The universal macOS build
      # serves both architectures from one archive, so both keys point at it.
      - name: Build the updater manifest
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          base="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"

          mac_archive=$(cd dist && ls -- *.app.tar.gz 2>/dev/null | head -n1 || true)
          windows_archive=$(cd dist && ls -- *-setup.exe 2>/dev/null | head -n1 || true)
          if [ -z "$mac_archive" ] || [ -z "$windows_archive" ]; then
            echo "::error::updater archives are missing — are the build jobs able to see TAURI_SIGNING_PRIVATE_KEY?"
            exit 1
          fi

          jq -n \
            --arg version "$version" \
            --arg notes "$RELEASE_NOTES" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg mac_url "$base/$mac_archive" \
            --arg mac_signature "$(cat "dist/$mac_archive.sig")" \
            --arg windows_url "$base/$windows_archive" \
            --arg windows_signature "$(cat "dist/$windows_archive.sig")" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $date,
              platforms: {
                "darwin-aarch64": { signature: $mac_signature, url: $mac_url },
                "darwin-x86_64": { signature: $mac_signature, url: $mac_url },
                "windows-x86_64": { signature: $windows_signature, url: $windows_url }
              }
            }' > dist/latest.json
          cat dist/latest.json

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(dist/*)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no installer files found under dist/"
            exit 1
          fi
          printf 'uploading: %s\n' "${files[@]}"

          # A previous attempt may already have created the release (possibly
          # without assets), and a re-run must not die with "release already
          # exists" — create it only when it is missing, then upload.
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "EasyTier Manager $GITHUB_REF_NAME" \
              --notes "$RELEASE_NOTES"
          fi

          gh release upload "$GITHUB_REF_NAME" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
